---
- name: Установка Apache
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true

- name: Создание index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: '0644'
  notify: Restart Apache

- name: Запуск Apache и автозагрузка
  ansible.builtin.systemd:
    name: apache2
    state: started
    enabled: true

- name: Открытие порта 80
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
